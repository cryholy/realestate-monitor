name: gap_radar_weekly

on:
  schedule:
    # 매주 일요일 22:30 KST = 일요일 13:30 UTC
    - cron: "30 13 * * 0"
  workflow_dispatch:
    inputs:
      report_date:
        description: "리포트 날짜 (YYYY-MM-DD). 비우면 다음 월요일 자동 계산"
        type: string
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve report date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            echo "report_date=${{ github.event.inputs.report_date }}" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          now_kst = datetime.now(timezone.utc).astimezone(kst)
          days_until_monday = (7 - now_kst.weekday()) % 7 or 7
          next_monday = (now_kst + timedelta(days=days_until_monday)).date()
          print(f"report_date={next_monday.isoformat()}")
          PY
          fi

      - name: Generate v2 report
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          OUT=$(python scripts/generate_gap_radar_report.py --version v2 --date "${{ steps.date.outputs.report_date }}")
          echo "$OUT"
          COUNTS_LINE=$(echo "$OUT" | grep -E '^COUNTS ' || true)
          if [ -z "$COUNTS_LINE" ]; then
            echo "COUNTS line missing — generation may have failed"
            exit 1
          fi
          # Multi-line output 안전 처리
          {
            echo "counts_line<<EOF"
            echo "$COUNTS_LINE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "markdown_path=reports/gap-radar/${{ steps.date.outputs.report_date }}-v2.md" >> "$GITHUB_OUTPUT"

      - name: Publish draft to Notion staging
        id: publish
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_STAGING_PARENT_ID: ${{ secrets.NOTION_STAGING_PARENT_ID }}
        run: |
          set -o pipefail
          OUT=$(python scripts/notion_publish.py \
            --date "${{ steps.date.outputs.report_date }}" \
            --markdown "${{ steps.gen.outputs.markdown_path }}")
          echo "$OUT"
          PAGE_URL=$(echo "$OUT" | awk -F': ' '/^URL: /{print $2}')
          if [ -z "$PAGE_URL" ]; then
            echo "URL line missing — publish may have failed"
            exit 1
          fi
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNTS="${{ steps.gen.outputs.counts_line }}"
          TOTAL=$(echo "$COUNTS" | grep -oE 'total_rows=[0-9]+' | cut -d= -f2)
          HIGH=$(echo "$COUNTS" | grep -oE 'high_reliability=[0-9]+' | cut -d= -f2)
          RATIO=$(echo "$COUNTS" | grep -oE 'ratio_up=[0-9]+' | cut -d= -f2)
          GAP=$(echo "$COUNTS" | grep -oE 'gap_down=[0-9]+' | cut -d= -f2)
          USE=$(echo "$COUNTS" | grep -oE 'use_rate_up=[0-9]+' | cut -d= -f2)
          python scripts/notify_gap_radar.py \
            --mode success \
            --date "${{ steps.date.outputs.report_date }}" \
            --page-url "${{ steps.publish.outputs.page_url }}" \
            --total-rows "$TOTAL" \
            --high-reliability "$HIGH" \
            --ratio-up "$RATIO" \
            --gap-down "$GAP" \
            --use-rate-up "$USE"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify_gap_radar.py \
            --mode failure \
            --date "${{ steps.date.outputs.report_date }}" \
            --reason "GHA job 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} 확인"
