name: realestate_monitor healthcheck

on:
  schedule:
    # 09:30 UTC = 18:30 KST. "monitor의 30분 후"라는 원래 의도는 성립하지 않는다 —
    # 이 워크플로 역시 동일하게 수 시간 지연돼 랜덤한 시각에 뜬다. 실제 판정은 시각이
    # 아니라 STALE_THRESHOLD_HOURS(36h) 창이 담당하므로 값 자체는 무해하다.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run healthcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/healthcheck.py
