name: realestate_monitor cron

on:
  schedule:
    # 04:23 UTC = 13:23 KST. 목표 실행 시각은 여전히 18:00 KST이며, 이 값은 역산치다.
    # GitHub schedule은 예정 시각에 큐잉만 되고 실제 실행은 지연된다. 2026-08-30~09-28
    # 30회 관측: 지연 중앙값 277분(4h37m), 범위 191~487분, 표준편차 66분. 정각(`0 9`)은
    # cron이 몰리는 최악 슬롯이라 분(23)도 정각을 피했다.  04:23 + 4h37m ≈ 18:00 KST.
    #
    # ponytail: 지연이 '고정 오프셋'인지 '특정 UTC 시간대로 수렴'인지는 예정 시각이 30일
    # 내내 상수였던 과거 데이터로는 원리적으로 구분 불가하다(두 계열이 상수 평행이동 관계).
    # 후자면 이 변경은 무효과이고, 그때는 schedule 의존을 버리고 외부 트리거로 올려야 한다.
    # 최소 2주 재측정 전에는 되돌리지 말 것 — 450723f가 1일 관측으로 되돌린 전례가 있다.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run mode (no alerts)"
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 정상 1~2분. 서킷 브레이커가 API 장애 시 ~5분 내 조기 종료하므로 20분은 안전 백스톱.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          python collector.py $ARGS
